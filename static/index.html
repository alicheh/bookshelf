<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookShelf</title>
<style>
  /* See DESIGN.md. Fonts: system (skim-fast, Finder-native, renders Persian). */
  :root {
    --sans: system-ui, -apple-system, "Segoe UI", "SF Pro Text", sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --row-h: 30px;
    --bg:#F7F4EE; --panel:#fff; --rail:#EFEAE0; --border:#E3DCCE;
    --text:#1C1A17; --muted:#6E665A; --faint:#A2988A;
    --accent:#C8862B; --accent-soft:#F2E2C2; --accent-ink:#4A2F00; --keep:#5FA463;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { display: flex; align-items: center; gap: 14px; padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .wordmark { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
  .wordmark .b { color: var(--accent); }
  .wordmark .sub { color: var(--faint); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search .ic { color: var(--muted); font-size: 12px; }
  .search input { border: 0; background: transparent; outline: none; color: var(--text); font-size: 13px; flex: 1; font-family: inherit; }
  .search .kbd { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .trust { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .trust .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--keep); }
  .gear { cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 7px; padding: 6px 9px; font-size: 13px; font-family: inherit; }
  .gear:hover { color: var(--text); }

  .browser { flex: 1; display: flex; overflow: hidden; }
  .rail { width: 184px; flex-shrink: 0; background: var(--rail); border-right: 1px solid var(--border); padding: 8px 7px; overflow-y: auto; }
  .rail .grp { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 11px 7px 4px; }
  .rail .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: var(--text); }
  .rail .item .ic { width: 15px; text-align: center; color: var(--muted); font-size: 12px; }
  .rail .item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .item .ct { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .rail .item:hover { background: var(--accent-soft); }
  .rail .item.active { background: var(--accent); color: #fff; }
  .rail .item.active .ic, .rail .item.active .ct { color: rgba(255,255,255,.85); }
  .rail .item.disabled { opacity: .5; cursor: default; }
  .rail .item.disabled:hover { background: transparent; }

  .col { flex: 0 0 auto; width: 210px; min-width: 90px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
  .col.books { flex: 1 1 0; width: auto; min-width: 160px; }
  .col.hidden { display: none; }
  /* drag handle to resize the panel on its left */
  .resizer { flex: 0 0 5px; cursor: col-resize; background: transparent; margin-left: -3px; z-index: 5; }
  .resizer:hover, .resizer.dragging { background: var(--accent-soft); }
  .resizer.hidden { display: none; }
  .col-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--panel); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); user-select: none; }
  .col-head.pivotable { cursor: pointer; }
  .col-head.pivotable:hover { color: var(--accent); }
  .col-head .pivot { color: var(--faint); }
  .col.focused .col-head { color: var(--accent); border-bottom-color: var(--accent); }
  .col-body { flex: 1; overflow-y: auto; padding: 3px 0; }

  .row { height: var(--row-h); display: flex; align-items: center; gap: 8px; padding: 0 9px 0 11px; cursor: pointer; white-space: nowrap; line-height: var(--row-h); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .ct { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .row .chev { color: var(--faint); font-size: 11px; width: 8px; }
  .row .ext { font-family: var(--mono); font-size: 9px; font-weight: 500; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .row:hover { background: var(--accent-soft); }
  .row.sel { background: var(--accent-soft); color: var(--accent-ink); }
  .row.sel .ct, .row.sel .chev { color: var(--accent-ink); }
  .col.focused .row.sel { background: var(--accent); color: #fff; }
  .col.focused .row.sel .ct, .col.focused .row.sel .chev { color: rgba(255,255,255,.8); }
  .col.focused .row.sel .ext { background: rgba(255,255,255,.22); color: #fff; border-color: transparent; }

  .preview { width: 340px; flex: 0 0 auto; min-width: 220px; background: var(--panel); padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .pdfview { width: 100%; height: 300px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
  .noview { width: 100%; height: 110px; border: 1px dashed var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; font-family: var(--mono); }
  .origin { border-top: 1px solid var(--border); padding-top: 12px; }
  .origin .ohdr { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); display: flex; justify-content: space-between; margin-bottom: 7px; }
  .origin .badge { color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; }
  .origin .opath { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; padding: 4px 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
  .origin .opath:last-child { border-bottom: 0; }
  .preview h1 { font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.015em; word-break: break-word; }
  .preview .author { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .meta { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .meta .pair { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; }
  .meta .pair .k { color: var(--faint); } .meta .pair .v { text-align: right; word-break: break-word; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 2px 9px; }
  .pv-actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn { flex: 1; text-align: center; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .empty { color: var(--faint); font-size: 12px; padding: 18px; text-align: center; }

  .palbar { flex-shrink: 0; display: none; align-items: center; gap: 8px; padding: 7px 14px; background: var(--panel); border-top: 1px solid var(--border); overflow-x: auto; }
  .palbar.open { display: flex; }
  .palbar .lbl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-right: 2px; }
  .swatch { display: flex; align-items: center; gap: 7px; cursor: pointer; border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px 4px 5px; background: transparent; font-family: var(--sans); font-size: 12px; color: var(--text); white-space: nowrap; }
  .swatch:hover { border-color: var(--accent); }
  .swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .swatch .chip { width: 26px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); position: relative; }
  .swatch .chip i { position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px; border-radius: 50%; }

  footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; background: var(--bg); border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); }
  footer .crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .crumb .sep { color: var(--faint); padding: 0 6px; }
  footer .crumb .leaf { color: var(--accent); }
  .hint { color: var(--faint); flex-shrink: 0; }
  .hint b { color: var(--muted); font-weight: 600; }
  .toast { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); font-size: 12px; padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <header>
    <div class="wordmark"><span class="b">Book</span>Shelf<span class="sub">a Daftar connector · books</span></div>
    <label class="search">
      <span class="ic">⌕</span>
      <input id="q" placeholder="Search title or author…  folders rebuild from your query" />
      <span class="kbd">⌘K</span>
    </label>
    <div class="trust"><span class="dot"></span><span id="trust">…</span></div>
    <button class="gear" onclick="document.getElementById('palbar').classList.toggle('open')" title="Theme">⚙</button>
  </header>

  <div class="browser">
    <nav class="rail" id="rail"></nav>
    <div class="resizer" data-t="rail"></div>
    <div class="col" id="c0"><div class="col-head pivotable" data-col="0"><span id="h0">Initial</span><span class="pivot" title="Change grouping (Initial → Format → Author → Year)">▾ group</span></div><div class="col-body" id="b0"></div></div>
    <div class="resizer" data-t="c0" id="rzc0"></div>
    <div class="col" id="c1"><div class="col-head pivotable" data-col="1"><span id="h1">Format</span><span class="pivot" title="Change grouping">▾ group</span></div><div class="col-body" id="b1"></div></div>
    <div class="resizer" data-t="c1" id="rzc1"></div>
    <div class="col books" id="c2"><div class="col-head" data-col="2"><span id="h2">Books</span><span></span></div><div class="col-body" id="b2"></div></div>
    <div class="resizer" data-t="preview"></div>
    <aside class="preview" id="preview"></aside>
  </div>

  <div class="palbar" id="palbar"><span class="lbl">palette</span></div>

  <footer>
    <div class="crumb" id="crumb"></div>
    <div class="hint"><b>↑↓</b> move &nbsp; <b>←→</b> column &nbsp; <b>↵</b> drill &nbsp; <b>⌘K</b> search</div>
  </footer>
  <div class="toast" id="toast"></div>

<script>
  const PALETTES = {
    paper:    { name:"Paper",      bg:"#F7F4EE", panel:"#FFFFFF", rail:"#EFEAE0", border:"#E3DCCE", text:"#1C1A17", muted:"#6E665A", faint:"#A2988A", accent:"#C8862B", soft:"#F2E2C2", ink:"#4A2F00", keep:"#5FA463" },
    finder:   { name:"Finder",     bg:"#F1F2F4", panel:"#FFFFFF", rail:"#E8EAEE", border:"#DCDFE5", text:"#191B1F", muted:"#6B7280", faint:"#9CA3AE", accent:"#2F6BE0", soft:"#E0EAFB", ink:"#11296B", keep:"#16A34A" },
    ice:      { name:"Ice",        bg:"#E8EFFA", panel:"#F6F9FE", rail:"#DCE7F6", border:"#C7D8EF", text:"#15202F", muted:"#59697F", faint:"#8A9AB1", accent:"#2563EB", soft:"#D6E4FB", ink:"#0E2A66", keep:"#1E9E6A" },
    graphite: { name:"Graphite",   bg:"#ECEDF0", panel:"#FAFAFB", rail:"#E3E4E8", border:"#D5D7DD", text:"#1A1C20", muted:"#686D76", faint:"#9A9FA8", accent:"#0F8C8C", soft:"#D4EEEE", ink:"#064040", keep:"#16A34A" },
    sage:     { name:"Sage",       bg:"#EDF1EB", panel:"#FBFCFA", rail:"#E4E9E0", border:"#D6DCCF", text:"#1A1F18", muted:"#66705C", faint:"#97A089", accent:"#3E7D52", soft:"#DCEDE0", ink:"#123018", keep:"#3E7D52" },
    night:    { name:"Night",      bg:"#1A1815", panel:"#211E1A", rail:"#161410", border:"#322D26", text:"#ECE6DA", muted:"#A99E8B", faint:"#6E6557", accent:"#E0A03C", soft:"#4A3A1C", ink:"#FBE9C6", keep:"#7CB87F" },
  };
  function applyPalette(key) {
    const p = PALETTES[key] || PALETTES.paper; const r = document.documentElement.style;
    r.setProperty('--bg',p.bg); r.setProperty('--panel',p.panel); r.setProperty('--rail',p.rail);
    r.setProperty('--border',p.border); r.setProperty('--text',p.text); r.setProperty('--muted',p.muted);
    r.setProperty('--faint',p.faint); r.setProperty('--accent',p.accent); r.setProperty('--accent-soft',p.soft);
    r.setProperty('--accent-ink',p.ink); r.setProperty('--keep',p.keep);
    st.palette = key; try { localStorage.setItem('bookshelf-palette', key); } catch(e){}
    renderPalbar();
  }
  function renderPalbar() {
    const bar = document.getElementById('palbar');
    bar.querySelectorAll('.swatch').forEach(n=>n.remove());
    Object.entries(PALETTES).forEach(([key,p]) => {
      const b = document.createElement('button');
      b.className = 'swatch' + (key===st.palette ? ' on':'');
      b.innerHTML = `<span class="chip" style="background:${p.bg}"><i style="background:${p.accent}"></i></span>${p.name}`;
      b.onclick = () => applyPalette(key);
      bar.appendChild(b);
    });
  }

  // facets available as pivotable columns (only those with real signal today)
  const PIVOTS = ["initial","format","author","year"];
  const facetLabel = { initial:"Initial", format:"Format", author:"Author", year:"Year", status:"Status", category:"Category" };

  // rail scopes -> base filter merged into every request
  const RAIL = [{ grp:"Library", items:[
    { ic:"▦", lbl:"All Books", base:{} },
    { ic:"▦", lbl:"PDFs", base:{format:"pdf"} },
    { ic:"▦", lbl:"EPUBs", base:{format:"epub"} },
  ]}];

  const st = {
    query:"", base:{}, railLbl:"All Books",
    facet:["initial","format"], selVal:[null,null], bookIdx:0, focus:2,
    g0:[], g1:[], books:[], total:0, palette:"paper",
  };

  const qs = (o) => Object.entries(o).filter(([,v])=>v!==null&&v!==undefined&&v!=="").map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
  async function getFacets(facet, filters) { const r = await fetch(`/api/facets?facet=${facet}&${qs(filters)}`); return (await r.json()).groups; }
  async function getBooks(filters) { const r = await fetch(`/api/column-books?per_page=1000&${qs({...filters})}`); return await r.json(); }
  async function getTotal() { const r = await fetch(`/api/column-books?per_page=1&${qs({...st.base, q:st.query})}`); return (await r.json()).total; }

  function baseF() { return { ...st.base, q: st.query }; }

  async function reloadFrom(level) {
    // search mode: collapse to a single results column, no facet browsing
    if (st.query.trim()) {
      const res = await getBooks({ ...st.base, q: st.query });
      st.books = res.books; if (st.bookIdx >= st.books.length) st.bookIdx = 0;
      st.focus = 2;
      render();
      getTotal().then(t => { st.total = t; renderTrust(); });
      return;
    }
    // level 0: reload col0 groups; 1: reload col1; 2: reload books
    if (level <= 0) {
      st.g0 = await getFacets(st.facet[0], baseF());
      if (!st.g0.find(g => String(g.value)===String(st.selVal[0]))) st.selVal[0] = st.g0.length ? st.g0[0].value : null;
    }
    if (level <= 1) {
      const f1 = { ...baseF(), [st.facet[0]]: st.selVal[0] };
      st.g1 = await getFacets(st.facet[1], f1);
      if (!st.g1.find(g => String(g.value)===String(st.selVal[1]))) st.selVal[1] = st.g1.length ? st.g1[0].value : null;
    }
    const fb = { ...baseF(), [st.facet[0]]: st.selVal[0], [st.facet[1]]: st.selVal[1] };
    const res = await getBooks(fb);
    st.books = res.books; if (st.bookIdx >= st.books.length) st.bookIdx = 0;
    render();
    getTotal().then(t => { st.total = t; renderTrust(); });
  }

  function render() {
    // rail
    const rail = document.getElementById('rail'); rail.innerHTML='';
    RAIL.forEach(sec => {
      const h = document.createElement('div'); h.className='grp'; h.textContent=sec.grp; rail.appendChild(h);
      sec.items.forEach(it => {
        const d = document.createElement('div'); d.className='item'+(it.lbl===st.railLbl?' active':'');
        d.innerHTML = `<span class="ic">${it.ic}</span><span class="lbl">${it.lbl}</span>`;
        d.onclick = () => { st.base = {...it.base}; st.railLbl = it.lbl; st.selVal=[null,null]; st.bookIdx=0; reloadFrom(0); };
        rail.appendChild(d);
      });
      const note = document.createElement('div'); note.className='item disabled';
      note.innerHTML = `<span class="ic">⌘</span><span class="lbl">Topics · after tagging</span>`;
      note.title = "Topic/Subtopic facets light up once the Daftar enrichment pass tags your books.";
      rail.appendChild(note);
    });
    // headers
    document.getElementById('h0').textContent = facetLabel[st.facet[0]];
    document.getElementById('h1').textContent = facetLabel[st.facet[1]];
    document.getElementById('h2').textContent = `Books · ${st.books.length}`;
    fillFolder('b0', 0, st.g0); fillFolder('b1', 1, st.g1);
    // books leaf
    const b2 = document.getElementById('b2'); b2.innerHTML='';
    if (!st.books.length) b2.innerHTML = '<div class="empty">no books here</div>';
    st.books.forEach((bk,i) => {
      const r = document.createElement('div'); r.className='row'+(i===st.bookIdx?' sel':'');
      const rtl = /[؀-ۿ]/.test(bk.title||'');
      r.innerHTML = `<span class="name" ${rtl?'dir="rtl"':''}>${esc(bk.title || bk.filename)}</span><span class="ext">${bk.extension}</span>`;
      r.onclick = () => { st.bookIdx=i; st.focus=2; render(); };
      r.ondblclick = () => openBook(bk);
      b2.appendChild(r);
    });
    // search mode hides the two facet columns + their resizers
    const searchMode = !!st.query.trim();
    ['c0','c1','rzc0','rzc1'].forEach(id => document.getElementById(id).classList.toggle('hidden', searchMode));
    [0,1,2].forEach(c => document.getElementById('c'+c).classList.toggle('focused', st.focus===c));
    renderPreview(st.books[st.bookIdx]); renderCrumb();
    scrollSel();
  }
  function fillFolder(bodyId, col, groups) {
    const body = document.getElementById(bodyId); body.innerHTML='';
    if (!groups.length) { body.innerHTML='<div class="empty">—</div>'; return; }
    groups.forEach(g => {
      const r = document.createElement('div');
      const on = String(g.value)===String(st.selVal[col]);
      r.className = 'row'+(on?' sel':'');
      const rtl = /[؀-ۿ]/.test(String(g.value));
      r.innerHTML = `<span class="name" ${rtl?'dir="rtl"':''}>${esc(g.value)}</span><span class="ct">${g.count}</span><span class="chev">›</span>`;
      r.onclick = () => {
        st.selVal[col] = g.value; st.focus = col;
        if (col===0) { st.selVal[1]=null; st.bookIdx=0; reloadFrom(1); }
        else { st.bookIdx=0; reloadFrom(2); }
      };
      body.appendChild(r);
    });
  }
  function renderPreview(bk) {
    const p = document.getElementById('preview');
    if (!bk) { p.innerHTML='<div class="empty">Nothing selected</div>'; return; }
    const rtl = /[؀-ۿ]/.test(bk.title||'');
    const authors = (bk.authors||[]).join(', ') || '—';
    const tags = (bk.tags||[]);
    const origins = (bk.origin_paths||[]);
    const view = bk.extension === 'pdf'
      ? `<iframe class="pdfview" src="/api/file/${bk.id}#toolbar=0&navpanes=0&view=FitH" title="preview"></iframe>`
      : `<div class="noview">no inline preview · ${(bk.extension||'').toUpperCase()}</div>`;
    const originBlock = origins.length ? `
      <div class="origin">
        <div class="ohdr"><span>original location${origins.length>1?'s':''}</span>${origins.length>1?`<span class="badge">${origins.length} copies</span>`:''}</div>
        ${origins.map(o=>`<div class="opath">${esc(o)}</div>`).join('')}
      </div>` : '';
    p.innerHTML = `
      ${view}
      <div><h1 ${rtl?'dir="rtl"':''}>${esc(bk.title || bk.filename)}</h1><div class="author">${esc(authors)}</div></div>
      <div class="meta">
        <div class="pair"><span class="k">format</span><span class="v">${(bk.extension||'').toUpperCase()}</span></div>
        <div class="pair"><span class="k">size</span><span class="v">${fmtSize(bk.size_bytes)}</span></div>
        <div class="pair"><span class="k">modified</span><span class="v">${bk.modified_date||'—'}</span></div>
        <div class="pair"><span class="k">status</span><span class="v">${bk.read_status||'unread'}</span></div>
        <div class="pair"><span class="k">file</span><span class="v">${esc(bk.filename||'')}</span></div>
      </div>
      ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      ${originBlock}
      <div class="pv-actions"><div class="btn primary" id="pvOpen">Open</div></div>`;
    const o = document.getElementById('pvOpen'); if (o) o.onclick = () => openBook(bk);
  }
  function renderCrumb() {
    const c = document.getElementById('crumb');
    const bk = st.books[st.bookIdx];
    const leaf = bk ? `<span class="sep">/</span><span class="leaf">${esc(bk.filename||bk.title)}</span>` : '';
    if (st.query.trim()) {
      c.innerHTML = `Search “${esc(st.query.trim())}” · ${st.books.length} result${st.books.length!==1?'s':''}` + leaf;
      return;
    }
    c.innerHTML = `${esc(st.railLbl)}<span class="sep">/</span>${esc(st.selVal[0]??'—')}<span class="sep">/</span>${esc(st.selVal[1]??'—')}` + leaf;
  }
  function renderTrust() {
    document.getElementById('trust').textContent = st.query
      ? `${st.total} of 3,937 match` : `3,937 books · all accounted for`;
  }

  function pivot(col) {
    const other = st.facet[1-col];
    const pool = PIVOTS.filter(f => f !== other);
    st.facet[col] = pool[(pool.indexOf(st.facet[col])+1) % pool.length];
    st.selVal[col] = null; if (col===0) st.selVal[1]=null; st.bookIdx=0;
    reloadFrom(col);
  }
  document.querySelectorAll('.col-head.pivotable').forEach(h => { const c=+h.dataset.col; h.onclick=()=>pivot(c); });

  async function openBook(bk) {
    if (!bk) return;
    const r = await fetch(`/api/open/${bk.id}`, { method:'POST' });
    if (!r.ok) { const d = await r.json().catch(()=>({})); toast('Cannot open: ' + (d.detail||'file missing')); }
    else toast('Opening ' + (bk.title||bk.filename));
  }

  // keyboard
  function curLen(c) { return [st.g0.length, st.g1.length, st.books.length][c]; }
  function curIdx(c) {
    if (c===2) return st.bookIdx;
    const groups = c===0 ? st.g0 : st.g1;
    const i = groups.findIndex(g => String(g.value)===String(st.selVal[c]));
    return i<0 ? 0 : i;
  }
  function selectAt(c, idx) {
    idx = Math.max(0, Math.min(curLen(c)-1, idx));
    if (c===2) { st.bookIdx = idx; render(); return; }
    const groups = c===0 ? st.g0 : st.g1;
    if (!groups[idx]) return;
    st.selVal[c] = groups[idx].value;
    if (c===0) { st.selVal[1]=null; st.bookIdx=0; reloadFrom(1); }
    else { st.bookIdx=0; reloadFrom(2); }
  }
  document.addEventListener('keydown', e => {
    if (e.target.id === 'q') { if (e.key==='Escape') e.target.blur(); return; }
    if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { document.getElementById('q').focus(); e.preventDefault(); return; }
    const c = st.focus;
    if (e.key==='ArrowDown') { selectAt(c, curIdx(c)+1); e.preventDefault(); }
    else if (e.key==='ArrowUp') { selectAt(c, curIdx(c)-1); e.preventDefault(); }
    else if (e.key==='ArrowLeft') { st.focus=Math.max(0,c-1); render(); e.preventDefault(); }
    else if (e.key==='ArrowRight') { st.focus=Math.min(2,c+1); render(); e.preventDefault(); }
    else if (e.key==='Enter') { if (c<2) { st.focus=c+1; render(); } else openBook(st.books[st.bookIdx]); e.preventDefault(); }
  });

  let qTimer;
  document.getElementById('q').addEventListener('input', e => {
    clearTimeout(qTimer);
    st.query = e.target.value;
    qTimer = setTimeout(() => { st.selVal=[null,null]; st.bookIdx=0; reloadFrom(0); }, 250);
  });

  function scrollSel() {
    ['b0','b1','b2'].forEach((id,c) => {
      const idx = c===2 ? st.bookIdx : curIdx(c);
      const el = document.getElementById(id).children[idx];
      if (el && st.focus===c) el.scrollIntoView({block:'nearest'});
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function fmtSize(b){ if(!b) return '—'; return b<1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB'; }
  let tTimer;
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove('show'),2200); }

  // ── resizable columns ──
  const RZ_TARGETS = { rail:'rail', c0:'c0', c1:'c1', preview:'preview' };
  function saveWidths() {
    const w = {};
    Object.values(RZ_TARGETS).forEach(id => { const el=document.getElementById(id); if (el) w[id]=Math.round(el.getBoundingClientRect().width); });
    try { localStorage.setItem('bookshelf-widths', JSON.stringify(w)); } catch(e){}
  }
  function loadWidths() {
    let w; try { w = JSON.parse(localStorage.getItem('bookshelf-widths')||'{}'); } catch(e){ w={}; }
    Object.entries(w).forEach(([id,px]) => { const el=document.getElementById(id); if (el && px) el.style.width = px+'px'; });
  }
  function makeResizer(rz) {
    const target = document.getElementById(RZ_TARGETS[rz.dataset.t]);
    const dir = rz.dataset.t === 'preview' ? -1 : 1;
    rz.addEventListener('mousedown', e => {
      e.preventDefault(); rz.classList.add('dragging'); document.body.style.userSelect='none';
      const startX = e.clientX, startW = target.getBoundingClientRect().width;
      const minW = parseInt(getComputedStyle(target).minWidth) || 90;
      const move = ev => { target.style.width = Math.max(minW, startW + dir*(ev.clientX-startX)) + 'px'; };
      const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); rz.classList.remove('dragging'); document.body.style.userSelect=''; saveWidths(); };
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
  }
  document.querySelectorAll('.resizer').forEach(makeResizer);

  // boot
  loadWidths();
  applyPalette((()=>{ try { return localStorage.getItem('bookshelf-palette')||'paper'; } catch(e){ return 'paper'; } })());
  reloadFrom(0);
</script>
</body>
</html>
