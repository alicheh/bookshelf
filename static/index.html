<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookShelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .book-card:hover .card-title { color: #4f46e5; }
    .star { cursor: pointer; transition: color .1s; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    /* smooth panel slide */
    .panel-enter { transform: translateX(100%); }
    .panel-enter-active { transition: transform .2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="bookshelf()" x-init="init()">

  <!-- ── Header ── -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center gap-3">
      <span class="text-2xl font-bold tracking-tight mr-2">📚 BookShelf</span>

      <!-- search -->
      <input
        type="search"
        placeholder="Search title, author, tags…"
        class="flex-1 rounded-lg px-4 py-2 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
        x-model.debounce.400ms="q"
        @input="page=1; load()"
      />

      <!-- stats pill -->
      <button @click="showStats=!showStats"
        class="text-sm bg-indigo-600 hover:bg-indigo-500 rounded-full px-3 py-1 whitespace-nowrap">
        <span x-text="stats.total ?? '…'"></span> books
      </button>

      <!-- rescan -->
      <button @click="rescan()"
        class="text-sm bg-indigo-600 hover:bg-indigo-500 rounded-full px-3 py-1">
        ↻ Rescan
      </button>
    </div>
  </header>

  <!-- ── Filters bar ── -->
  <div class="bg-white border-b shadow-sm sticky top-[56px] z-10">
    <div class="max-w-screen-xl mx-auto px-4 py-2 flex flex-wrap items-center gap-3 text-sm">

      <!-- format tabs -->
      <div class="flex gap-1">
        <template x-for="f in ['all','pdf','epub','mobi','azw3','djvu']" :key="f">
          <button
            @click="fmt = f==='all' ? '' : f; page=1; load()"
            :class="(fmt==='' && f==='all') || fmt===f
              ? 'bg-indigo-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'"
            class="rounded-full px-3 py-1 capitalize font-medium transition"
            x-text="f"></button>
        </template>
      </div>

      <div class="h-5 border-l border-gray-200"></div>

      <!-- status filter -->
      <select x-model="statusFilter" @change="page=1; load()"
        class="border rounded-lg px-2 py-1 text-sm bg-white">
        <option value="">All status</option>
        <option value="unread">Unread</option>
        <option value="reading">Reading</option>
        <option value="read">Read</option>
      </select>

      <!-- sort -->
      <select x-model="sortBy" @change="page=1; load()"
        class="border rounded-lg px-2 py-1 text-sm bg-white">
        <option value="title">Title A–Z</option>
        <option value="author">Author A–Z</option>
        <option value="date_added">Recently Added</option>
        <option value="size">Largest First</option>
        <option value="format">Format</option>
        <option value="rating">Highest Rated</option>
      </select>

      <!-- result count -->
      <span class="ml-auto text-gray-400" x-text="`${total} result${total!==1?'s':''}`"></span>
    </div>
  </div>

  <!-- ── Stats panel ── -->
  <div x-show="showStats" x-cloak @click.self="showStats=false"
    class="fixed inset-0 bg-black/40 z-30 flex justify-end">
    <div class="bg-white w-96 shadow-2xl p-6 overflow-y-auto" @click.stop>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800">Library Stats</h2>
        <button @click="showStats=false" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-indigo-50 rounded-xl p-4 text-center">
          <div class="text-3xl font-bold text-indigo-600" x-text="stats.total"></div>
          <div class="text-xs text-gray-500 mt-1">Total books</div>
        </div>
        <div class="bg-indigo-50 rounded-xl p-4 text-center">
          <div class="text-3xl font-bold text-indigo-600" x-text="stats.total_gb + ' GB'"></div>
          <div class="text-xs text-gray-500 mt-1">Total size</div>
        </div>
      </div>
      <!-- by format -->
      <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">By Format</h3>
      <template x-for="row in stats.by_format" :key="row.extension">
        <div class="flex items-center justify-between py-1 border-b last:border-0">
          <span class="flex items-center gap-2">
            <span :class="fmtBadgeClass(row.extension)" class="text-xs px-2 py-0.5 rounded-full font-medium capitalize" x-text="row.extension"></span>
          </span>
          <span class="font-semibold text-gray-700" x-text="row.n"></span>
        </div>
      </template>
      <!-- by status -->
      <h3 class="text-sm font-semibold text-gray-500 uppercase mt-4 mb-2">By Status</h3>
      <template x-for="[s, n] in Object.entries(stats.by_status ?? {})" :key="s">
        <div class="flex items-center justify-between py-1 border-b last:border-0">
          <span class="flex items-center gap-2">
            <span :class="statusDot(s)" class="inline-block w-3 h-3 rounded-full"></span>
            <span class="capitalize" x-text="s"></span>
          </span>
          <span class="font-semibold text-gray-700" x-text="n"></span>
        </div>
      </template>
      <!-- by category -->
      <template x-if="stats.by_category && stats.by_category.length > 1">
        <div>
          <h3 class="text-sm font-semibold text-gray-500 uppercase mt-4 mb-2">By Category</h3>
          <template x-for="row in stats.by_category" :key="row.cat">
            <div class="flex items-center justify-between py-1 border-b last:border-0">
              <span class="text-gray-700 capitalize" x-text="row.cat"></span>
              <span class="font-semibold text-gray-700" x-text="row.n"></span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Main content ── -->
  <main class="max-w-screen-xl mx-auto px-4 py-5">

    <!-- loading indicator -->
    <div x-show="loading" class="flex justify-center py-20">
      <div class="text-indigo-500 text-lg animate-pulse">Loading books…</div>
    </div>

    <!-- empty state -->
    <div x-show="!loading && books.length===0" class="text-center py-20 text-gray-400">
      <div class="text-5xl mb-3">📭</div>
      <p class="text-lg">No books found.</p>
      <p class="text-sm mt-1" x-show="q || fmt || statusFilter">Try clearing the filters.</p>
      <p class="text-sm mt-1" x-show="!q && !fmt && !statusFilter">
        Run <code class="bg-gray-100 px-1 rounded">python consolidate.py</code> then <code class="bg-gray-100 px-1 rounded">python scanner.py</code>.
      </p>
    </div>

    <!-- book grid -->
    <div x-show="!loading && books.length>0"
      class="grid gap-3"
      style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr))">

      <template x-for="book in books" :key="book.id">
        <div @click="openDetail(book)"
          class="book-card bg-white rounded-xl shadow-sm hover:shadow-md cursor-pointer transition-shadow border border-gray-100 p-4 flex flex-col gap-2 relative">

          <!-- format badge -->
          <span :class="fmtBadgeClass(book.extension)"
            class="absolute top-3 right-3 text-xs px-2 py-0.5 rounded-full font-semibold uppercase">
            <span x-text="book.extension"></span>
          </span>

          <!-- status dot -->
          <span :class="statusDot(book.read_status)"
            class="absolute top-3 left-3 inline-block w-2.5 h-2.5 rounded-full"
            :title="book.read_status"></span>

          <!-- title -->
          <h3 class="card-title font-semibold text-gray-800 text-sm leading-snug mt-3 line-clamp-2 transition-colors"
            x-text="book.title || book.filename"></h3>

          <!-- author -->
          <p class="text-xs text-gray-500 line-clamp-1"
            x-text="book.authors.length ? book.authors.join(', ') : '—'"></p>

          <!-- tags -->
          <div class="flex flex-wrap gap-1 mt-auto" x-show="book.tags.length > 0">
            <template x-for="tag in book.tags.slice(0,3)" :key="tag">
              <span class="text-xs bg-gray-100 text-gray-600 rounded-full px-2 py-0.5" x-text="tag"></span>
            </template>
          </div>

          <!-- bottom row: size + rating -->
          <div class="flex items-center justify-between mt-1">
            <span class="text-xs text-gray-400" x-text="fmtSize(book.size_bytes)"></span>
            <span x-show="book.rating > 0" class="text-xs text-amber-400" x-text="'★'.repeat(book.rating)"></span>
          </div>
        </div>
      </template>
    </div>

    <!-- pagination -->
    <div x-show="pages > 1" class="flex justify-center items-center gap-2 mt-8 text-sm">
      <button @click="page=Math.max(1,page-1); load()" :disabled="page===1"
        class="px-3 py-1 rounded-lg border disabled:opacity-30 hover:bg-gray-100">← Prev</button>

      <template x-for="p in pageRange()" :key="p">
        <button v-if="p!=='…'"
          @click="if(p!=='…'){page=p;load()}"
          :class="p===page ? 'bg-indigo-600 text-white' : p==='…' ? 'pointer-events-none' : 'hover:bg-gray-100'"
          class="px-3 py-1 rounded-lg border"
          x-text="p"></button>
      </template>

      <button @click="page=Math.min(pages,page+1); load()" :disabled="page===pages"
        class="px-3 py-1 rounded-lg border disabled:opacity-30 hover:bg-gray-100">Next →</button>

      <span class="text-gray-400 ml-2" x-text="`Page ${page} of ${pages}`"></span>
    </div>
  </main>

  <!-- ── Book Detail Panel ── -->
  <div x-show="selectedBook" x-cloak
    class="fixed inset-0 z-40 flex"
    @keydown.escape.window="closeDetail()">

    <!-- backdrop -->
    <div class="flex-1 bg-black/30" @click="closeDetail()"></div>

    <!-- panel -->
    <div class="w-full max-w-md bg-white shadow-2xl overflow-y-auto flex flex-col"
      x-show="selectedBook"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full">

      <div class="p-5 flex-1" x-data="detailPanel()" x-init="init($el)">

        <!-- header -->
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-2">
            <span :class="fmtBadgeClass(selectedBook?.extension)"
              class="text-xs px-2 py-0.5 rounded-full font-semibold uppercase"
              x-text="selectedBook?.extension"></span>
            <span class="text-xs text-gray-400" x-text="fmtSize(selectedBook?.size_bytes)"></span>
            <span class="text-xs text-gray-400" x-text="selectedBook?.modified_date"></span>
          </div>
          <button @click="closeDetail()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
        </div>

        <!-- title (editable) -->
        <div class="mb-3">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Title</label>
          <input type="text" x-model="edit.title"
            class="w-full border-b-2 border-gray-200 focus:border-indigo-400 outline-none py-1 text-lg font-semibold text-gray-800 bg-transparent" />
        </div>

        <!-- authors (editable) -->
        <div class="mb-3">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Author(s)</label>
          <input type="text" :value="edit.authors.join(', ')"
            @input="edit.authors = $event.target.value.split(',').map(s=>s.trim()).filter(Boolean)"
            placeholder="Author One, Author Two"
            class="w-full border-b-2 border-gray-200 focus:border-indigo-400 outline-none py-1 text-sm text-gray-700 bg-transparent" />
        </div>

        <!-- category -->
        <div class="mb-3">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Category</label>
          <input type="text" x-model="edit.category" placeholder="e.g. tech, psychology, fiction…"
            class="w-full border-b-2 border-gray-200 focus:border-indigo-400 outline-none py-1 text-sm text-gray-700 bg-transparent" />
        </div>

        <!-- tags -->
        <div class="mb-3">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Tags</label>
          <input type="text" :value="edit.tags.join(', ')"
            @input="edit.tags = $event.target.value.split(',').map(s=>s.trim()).filter(Boolean)"
            placeholder="ai, python, coaching…"
            class="w-full border-b-2 border-gray-200 focus:border-indigo-400 outline-none py-1 text-sm text-gray-700 bg-transparent" />
          <div class="flex flex-wrap gap-1 mt-1" x-show="edit.tags.length">
            <template x-for="tag in edit.tags" :key="tag">
              <span class="text-xs bg-indigo-50 text-indigo-600 rounded-full px-2 py-0.5" x-text="tag"></span>
            </template>
          </div>
        </div>

        <div class="border-t border-gray-100 my-4"></div>

        <!-- read status -->
        <div class="mb-3">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-2">Status</label>
          <div class="flex gap-2">
            <template x-for="s in ['unread','reading','read']" :key="s">
              <button @click="edit.read_status=s"
                :class="edit.read_status===s ? statusActive(s) : 'bg-gray-100 text-gray-600'"
                class="flex-1 py-1.5 rounded-lg text-sm font-medium capitalize transition">
                <span x-text="s"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- rating -->
        <div class="mb-4">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-2">Rating</label>
          <div class="flex gap-1">
            <template x-for="n in [1,2,3,4,5]" :key="n">
              <button @click="edit.rating = edit.rating===n ? 0 : n"
                :class="n <= edit.rating ? 'text-amber-400' : 'text-gray-200'"
                class="star text-3xl leading-none">★</button>
            </template>
          </div>
        </div>

        <!-- notes -->
        <div class="mb-4">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Notes</label>
          <textarea x-model="edit.notes" rows="3" placeholder="Your notes…"
            class="w-full border border-gray-200 rounded-lg p-2 text-sm text-gray-700 focus:outline-none focus:border-indigo-300 resize-none"></textarea>
        </div>

        <!-- filename (read-only) -->
        <div class="mb-4">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">File</label>
          <p class="text-xs text-gray-400 break-all font-mono" x-text="selectedBook?.filename"></p>
        </div>

        <!-- source path -->
        <div class="mb-4" x-show="selectedBook?.source_path">
          <label class="text-xs font-semibold text-gray-400 uppercase block mb-1">Original Source</label>
          <p class="text-xs text-gray-400 break-all" x-text="selectedBook?.source_path"></p>
        </div>
      </div>

      <!-- sticky bottom actions -->
      <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4 flex gap-3">
        <button @click="openBook()"
          class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-sm transition">
          Open Book
        </button>
        <button @click="saveBook()"
          :class="saved ? 'bg-green-500' : 'bg-gray-800 hover:bg-gray-700'"
          class="flex-1 text-white py-2.5 rounded-xl font-semibold text-sm transition">
          <span x-text="saved ? '✓ Saved' : 'Save Changes'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div x-show="toast" x-cloak x-transition
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-5 py-2.5 rounded-full shadow-lg z-50"
    x-text="toast"></div>

  <script>
  function bookshelf() {
    return {
      books: [], total: 0, pages: 1, page: 1,
      q: '', fmt: '', statusFilter: '', sortBy: 'title',
      loading: false,
      selectedBook: null,
      showStats: false,
      stats: {},
      toast: '',

      async init() {
        await this.load();
        await this.loadStats();
      },

      async load() {
        this.loading = true;
        const p = new URLSearchParams({
          q: this.q, format: this.fmt, status: this.statusFilter,
          sort: this.sortBy, page: this.page, per_page: 60,
        });
        const res = await fetch(`/api/books?${p}`);
        const data = await res.json();
        this.books = data.books;
        this.total = data.total;
        this.pages = data.pages;
        this.loading = false;
      },

      async loadStats() {
        const res = await fetch('/api/stats');
        this.stats = await res.json();
      },

      openDetail(book) {
        this.selectedBook = book;
      },

      closeDetail() {
        this.selectedBook = null;
      },

      async rescan() {
        this.showToast('Scanning…');
        const res = await fetch('/api/scan', { method: 'POST' });
        const data = await res.json();
        this.showToast(`Done: ${data.added} added, ${data.updated} updated`);
        await this.load();
        await this.loadStats();
      },

      pageRange() {
        const p = this.page, total = this.pages;
        if (total <= 7) return Array.from({length: total}, (_, i) => i+1);
        const pages = [1];
        if (p > 3) pages.push('…');
        for (let i = Math.max(2, p-1); i <= Math.min(total-1, p+1); i++) pages.push(i);
        if (p < total - 2) pages.push('…');
        pages.push(total);
        return pages;
      },

      fmtSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      },

      fmtBadgeClass(ext) {
        const map = {
          pdf: 'bg-red-100 text-red-700',
          epub: 'bg-emerald-100 text-emerald-700',
          mobi: 'bg-sky-100 text-sky-700',
          azw3: 'bg-sky-100 text-sky-700',
          azw:  'bg-sky-100 text-sky-700',
          djvu: 'bg-orange-100 text-orange-700',
          cbz:  'bg-purple-100 text-purple-700',
          cbr:  'bg-purple-100 text-purple-700',
        };
        return map[ext] || 'bg-gray-100 text-gray-600';
      },

      statusDot(s) {
        return {unread: 'bg-gray-300', reading: 'bg-amber-400', read: 'bg-green-400'}[s] || 'bg-gray-200';
      },

      showToast(msg, ms=2500) {
        this.toast = msg;
        setTimeout(() => this.toast = '', ms);
      },
    };
  }

  function detailPanel() {
    return {
      edit: {},
      saved: false,

      init() {
        this.$watch('selectedBook', book => {
          if (book) {
            this.edit = {
              title:       book.title || '',
              authors:     [...(book.authors || [])],
              category:    book.category || '',
              tags:        [...(book.tags || [])],
              read_status: book.read_status || 'unread',
              rating:      book.rating || 0,
              notes:       book.notes || '',
            };
            this.saved = false;
          }
        });
      },

      async saveBook() {
        const res = await fetch(`/api/books/${selectedBook.id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.edit),
        });
        const updated = await res.json();
        // update in books list
        const idx = bookshelf().books.findIndex(b => b.id === updated.id);
        if (idx >= 0) bookshelf().books[idx] = updated;
        Object.assign(selectedBook, updated);
        this.saved = true;
        setTimeout(() => this.saved = false, 2000);
      },

      async openBook() {
        const res = await fetch(`/api/open/${selectedBook.id}`, { method: 'POST' });
        if (!res.ok) {
          const d = await res.json();
          bookshelf().showToast('Cannot open: ' + (d.detail || 'file not on disk'));
        }
      },

      statusActive(s) {
        return {
          unread:  'bg-gray-400 text-white',
          reading: 'bg-amber-400 text-white',
          read:    'bg-green-500 text-white',
        }[s];
      },

      fmtBadgeClass: bookshelf().fmtBadgeClass,
      fmtSize: bookshelf().fmtSize,
    };
  }
  </script>
</body>
</html>
